name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  native:
    name: native (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System libraries iced, rfd and the sound device build against
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev
      - uses: actions/checkout@v4
        with:
          repository: cuelight-org/cuelight-examples
          path: cuelight-examples
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          CUELIGHT_EXAMPLES: ${{ github.workspace }}/cuelight-examples
      - name: The reload budget, as the release build meets it
        run: cargo test --release -p cuelight-editor-core --test reload -- --nocapture
        env:
          CUELIGHT_EXAMPLES: ${{ github.workspace }}/cuelight-examples

  web:
    name: web (wasm32 build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.1
        with:
          version: latest
      - run: cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: Build the page
        run: trunk build
      - name: Size budget (the .wasm stays under 12 MB)
        run: |
          wasm=$(ls dist/*.wasm)
          size=$(stat -c %s "$wasm")
          echo "$wasm: $size bytes"
          test "$size" -lt 12582912
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist
