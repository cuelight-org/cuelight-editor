[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/francisdb/cuelight-editor"
publish = false

# Every pin in one place. The engine crates move together, and iced with
# them when wgpu changes (see README).
[workspace.dependencies]
cuelight = { git = "https://github.com/francisdb/cuelight", rev = "6630ae468943629b35abffa7da9f3abd8b3cac4f" }
cuelight-core = { git = "https://github.com/francisdb/cuelight", rev = "6630ae468943629b35abffa7da9f3abd8b3cac4f" }
cuelight-loader = { git = "https://github.com/francisdb/cuelight", rev = "6630ae468943629b35abffa7da9f3abd8b3cac4f" }
cuelight-audio = { git = "https://github.com/francisdb/cuelight", rev = "6630ae468943629b35abffa7da9f3abd8b3cac4f", default-features = false }
# iced is unreleased on the wgpu the engine uses (29), so it is pinned to
# a commit of master: the last on wgpu 29 that we checked.
iced = { git = "https://github.com/iced-rs/iced", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "10e9b995eb5af74dbac08ed62b01971fe7e495b2" }
log = "0.4"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
