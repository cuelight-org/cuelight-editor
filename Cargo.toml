[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/cuelight-org/cuelight-editor"
publish = false

[workspace.lints.clippy]
# The editor must never take the user's work down: what can fail is a
# value. Tests may still panic; clippy.toml allows it there.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

# Every pin in one place. The engine crates move together, and iced with
# them when wgpu changes (see README).
[workspace.dependencies]
cuelight = { git = "https://github.com/cuelight-org/cuelight", rev = "5553103fcf397f097f26ef2cf85699a55bcd7f8e" }
cuelight-core = { git = "https://github.com/cuelight-org/cuelight", rev = "5553103fcf397f097f26ef2cf85699a55bcd7f8e" }
cuelight-loader = { git = "https://github.com/cuelight-org/cuelight", rev = "5553103fcf397f097f26ef2cf85699a55bcd7f8e" }
cuelight-audio = { git = "https://github.com/cuelight-org/cuelight", rev = "5553103fcf397f097f26ef2cf85699a55bcd7f8e", default-features = false }
# iced is unreleased on the wgpu the engine uses (30), so it is pinned to
# a commit of master on wgpu 30 that we checked.
iced = { git = "https://github.com/iced-rs/iced", rev = "fc0c3ba73dad424e0560dab1f0477aae077c2442", features = ["image-without-codecs", "svg"] }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "fc0c3ba73dad424e0560dab1f0477aae077c2442" }
log = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
