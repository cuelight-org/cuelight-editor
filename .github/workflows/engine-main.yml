# The editor pins the engine to a commit. This builds it against the
# engine's main branch instead, weekly and on demand, so a change there
# that breaks the editor shows up within days rather than at the next
# bump.
name: against engine main

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Point every engine crate at main; the pinned revs in Cargo.toml stay.
  CARGO_PATCH: >-
    --config patch."https://github.com/cuelight-org/cuelight".cuelight.git="https://github.com/cuelight-org/cuelight"
    --config patch."https://github.com/cuelight-org/cuelight".cuelight.branch="main"
    --config patch."https://github.com/cuelight-org/cuelight".cuelight-core.git="https://github.com/cuelight-org/cuelight"
    --config patch."https://github.com/cuelight-org/cuelight".cuelight-core.branch="main"
    --config patch."https://github.com/cuelight-org/cuelight".cuelight-loader.git="https://github.com/cuelight-org/cuelight"
    --config patch."https://github.com/cuelight-org/cuelight".cuelight-loader.branch="main"
    --config patch."https://github.com/cuelight-org/cuelight".cuelight-audio.git="https://github.com/cuelight-org/cuelight"
    --config patch."https://github.com/cuelight-org/cuelight".cuelight-audio.branch="main"

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries iced, rfd and the sound device build against
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev
      - run: cargo test --workspace $CARGO_PATCH
