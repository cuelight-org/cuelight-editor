# The editor pins the engine to a commit. This builds it against the
# engine's main branch instead, weekly and on demand, so a change there
# that breaks the editor shows up within days rather than at the next
# bump.
name: against engine main

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries iced, rfd and the sound device build against
        run: |
          sudo apt-get -qq update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev
      # Cargo refuses a [patch] to the same git URL, so the pinned revs
      # are rewritten to main in this checkout only.
      - name: Point the engine crates at main
        run: sed -i -E '/cuelight-org\/cuelight"/ s/rev = "[0-9a-f]+"/branch = "main"/' Cargo.toml
      - run: cargo test --workspace
