[package]
name = "cuelight-editor"
description = "Editor for cuelight shows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
cuelight-editor-core = { path = "../cuelight-editor-core" }
cuelight.workspace = true
cuelight-core.workspace = true
iced.workspace = true
log.workspace = true
rfd = "0.17"
serde_json.workspace = true
# The stage draws with the engine's renderer. Both must be the wgpu iced
# draws with (30 today); cargo unifies them, and a mismatch fails the
# build rather than the picture.
vello = "0.11"
wgpu = { version = "30", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
png = "0.18"
# Sound through a device on the desktop.
cuelight-audio = { workspace = true, features = ["live"] }
# Watching the open show's files for changes made outside the editor.
notify-debouncer-mini = "0.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Sound through the browser's WebAudio.
cuelight-audio = { workspace = true, features = ["web"] }
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Location", "Response", "UrlSearchParams",
    # dropping a file on the page
    "Document", "EventTarget", "Event", "DragEvent", "DataTransfer", "FileList", "File", "Blob",
    # saving is a download
    "Url", "Element", "HtmlElement", "HtmlAnchorElement",
    # unsaved edits kept in the page's storage, and asked about on closing
    "Storage", "BeforeUnloadEvent",
] }

[dev-dependencies]
iced_test.workspace = true
tempfile = "3"

[lints]
workspace = true
